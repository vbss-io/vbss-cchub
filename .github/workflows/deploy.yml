name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [prd]
    paths:
      - 'apps/landing/**'
      - package-lock.json
      - .github/workflows/deploy.yml

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish landing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm ci -w @cch/landing
          npm run build -w @cch/landing

      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STATIC_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STATIC_DEPLOY_ACCOUNT }}
          PROJECT: ${{ secrets.STATIC_DEPLOY_PROJECT }}
        run: npx --yes wrangler@4.151.0 pages deploy apps/landing/dist --project-name="$PROJECT" --branch=prd --commit-hash="$GITHUB_SHA"
